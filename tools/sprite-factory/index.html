<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IsoGame Sprite Factory</title>
    <style>
      :root {
        --bg: #1b1622;
        --panel: #241d2e;
        --panel-2: #2d2439;
        --line: #3b3049;
        --text: #e6dff0;
        --muted: #9d92ad;
        --accent: #d9a441;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        display: grid;
        grid-template-columns: 200px 1fr 260px;
        height: 100vh;
      }
      h1 { font-size: 13px; margin: 0 0 4px; letter-spacing: .08em; text-transform: uppercase; }
      h2 { font-size: 11px; margin: 18px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
      aside, main { overflow-y: auto; padding: 16px; }
      aside { background: var(--panel); border-right: 1px solid var(--line); }
      #inspector { background: var(--panel); border-left: 1px solid var(--line); border-right: 0; }
      .asset {
        display: block; width: 100%; text-align: left; padding: 7px 9px; margin-bottom: 3px;
        background: transparent; border: 1px solid transparent; border-radius: 5px;
        color: var(--text); font: inherit; cursor: pointer;
      }
      .asset:hover { background: var(--panel-2); }
      .asset[aria-selected='true'] { background: var(--panel-2); border-color: var(--accent); color: var(--accent); }
      .asset small { display: block; color: var(--muted); font-size: 11px; }
      .frames { display: flex; flex-wrap: wrap; gap: 14px; }
      .frame { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
      .frame canvas { display: block; image-rendering: pixelated; border-radius: 4px; }
      .frame header { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; padding-bottom: 8px; }
      .frame header b { color: var(--text); font-weight: 600; }
      label.field { display: block; margin-bottom: 10px; color: var(--muted); font-size: 11px; }
      label.field span { display: flex; justify-content: space-between; margin-bottom: 3px; }
      label.field span b { color: var(--text); font-weight: 600; }
      input[type='range'] { width: 100%; accent-color: var(--accent); }
      input[type='color'] { width: 100%; height: 26px; background: none; border: 1px solid var(--line); border-radius: 4px; }
      label.check { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; color: var(--muted); }
      button.action {
        width: 100%; padding: 8px; margin-bottom: 6px; border-radius: 5px; cursor: pointer;
        background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font: inherit;
      }
      button.action:hover { border-color: var(--accent); color: var(--accent); }
      .swatches { display: flex; flex-wrap: wrap; gap: 3px; }
      .swatch { width: 18px; height: 18px; border-radius: 3px; border: 1px solid rgba(0,0,0,.4); }
      .stats { color: var(--muted); font-size: 11px; }
      .stats b { color: var(--text); font-weight: 600; }
      .note { color: var(--muted); font-size: 11px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
    </style>
  </head>
  <body>
    <aside>
      <h1>Sprite Factory</h1>
      <div class="stats">3D &rarr; isometric pixel art</div>
      <h2>Catalogue</h2>
      <div id="assets"></div>
    </aside>

    <main>
      <div id="frames" class="frames"></div>
      <div class="note" id="notes"></div>
    </main>

    <aside id="inspector"></aside>

    <script type="module" src="/tools/sprite-factory/src/ui.ts"></script>
  </body>
</html>
